default: &default
  adapter: postgresql
  encoding: unicode
  username: postgres
  password: postgres123
  host: 127.0.0.1
  port: 5432
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: dinelyt_development

test:
  <<: *default
  database: dinelyt_test

production:
  <<: *default
  database: dinelyt_production
  username: postgresql
  password: <%= ENV["DINELYT_DATABASE_PASSWORD"] %>
